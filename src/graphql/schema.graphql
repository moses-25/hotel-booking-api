# Common
scalar DateTime

# ---------------------------------- Types -------------------------------------

type UserRole       { id: ID! name: String! }
type UserStatus     { id: ID! name: String! }
type Phone          { id: ID! number: String! }

type User {
  id:               ID!
  firstName:        String!
  middleName:       String
  firstLastName:    String!
  secondLastName:   String
  email:            String!
  role:             UserRole!
  status:           UserStatus!
  lastLogin:        DateTime!
  phones:           [Phone!]!
  createdAt:        DateTime!
  updatedAt:        DateTime!
}

type RoomType {
  id:               ID!
  name:             String!
  description:      String!
  pricePerNight:    Float!
  maxOccupancy:     Int!
  amenities:        [String!]!
  createdAt:        DateTime!
  updatedAt:        DateTime!
}

type AuthPayload {
  token:            String!
  user:             User!
}

type ResetPasswordResult {
  success:          Boolean!
  message:          String!
}

# --------------------------------- Inputs -------------------------------------

input LoginDto {
  email:            String!
  password:         String!
}

input ResetPasswordDto {
  email:            String!
  firstName:        String!
  firstLastName:    String!
  newPassword:      String!
}

input UserIdDto     { id: ID! }

input UserEmailDto  { email: String! }

input CreateUserDto {
  firstName:        String!
  middleName:       String
  firstLastName:    String!
  secondLastName:   String
  email:            String!
  password:         String!
  role:             ID!
  status:           ID!
  phones:           [String!]!
  lastLogin:        DateTime
}

input RoomTypeIdDto {
  roomTypeId:       ID!
}

input CreateRoomTypeDto {
  name:             String!
  description:      String!
  pricePerNight:    Float!
  maxOccupancy:     Int!
  amenities:        [String!]!
}

input UpdateRoomTypeDto {
  roomTypeId:       ID!
  name:             String
  description:      String
  pricePerNight:    Float
  maxOccupancy:     Int
  amenities:        [String!]
}

input UpdateUserDto {
  firstName:        String
  middleName:       String
  firstLastName:    String
  secondLastName:   String
  email:            String
  role:             ID
  status:           ID
}

input UpdatePhonesDto {
  id:               ID!
  phones:           [String!]!
}

# --------------------------------- Queries ------------------------------------

type Query {

  "Profile of the currently authenticated user."
  me: User!

  "One user by id. Administrator only."
  user(dto: UserIdDto!): User!

  "One user by email. Administrator only."
  userByEmail(dto: UserEmailDto!): User!

  "Every user ordered by id ascending. Administrator only."
  allUsers: [User!]!

  "One room type by ID. Administrator only."
  roomType(dto: RoomTypeIdDto!): RoomType!

  "Every room type ordered by ID ascending. Administrator only."
  allRoomTypes: [RoomType!]!
}

# ------------------------------- Mutations ------------------------------------

type Mutation {

  "Authenticate with email + password. Public."
  login(dto: LoginDto!): AuthPayload!

  "Reset a forgotten password after verifying identity. Public."
  resetPassword(dto: ResetPasswordDto!): ResetPasswordResult!

  "Create a new user. Administrator only."
  newUser(dto: CreateUserDto!): User!

  "Update an existing user (partial). Administrator only."
  updateUser(id: ID!, dto: UpdateUserDto!): User!

  "Replace a user's full phone collection. Administrator only."
  updateUserPhones(dto: UpdatePhonesDto!): User!

  "Delete a user and their phones. Administrator only."
  deleteUser(dto: UserIdDto!): Boolean!

  "Create a room type. Administrator only."
  newRoomType(dto: CreateRoomTypeDto!): RoomType!

  "Update a room type (partial). Administrator only."
  updateRoomType(dto: UpdateRoomTypeDto!): RoomType!

  "Delete a room type. Administrator only."
  deleteRoomType(dto: RoomTypeIdDto!): Boolean!
}
