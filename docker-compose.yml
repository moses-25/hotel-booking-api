services:
  hotel-booking-db:
    image: postgres:16
    container_name: hotel-booking-db
    restart: always
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      TZ: UTC
      PGTZ: UTC
      PGPORT: ${DEV_DB_CONTAINER_PORT:-${DB_CONTAINER_PORT:-5432}}
      POSTGRES_DB: ${DEV_DB_NAME:-${DB_NAME}}
      POSTGRES_USER: ${DEV_DB_USER:-${DB_USER}}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-${DB_PASSWORD}}
    ports:
      - "${DEV_DB_PORT:-${DB_PORT:-5432}}:${DEV_DB_CONTAINER_PORT:-${DB_CONTAINER_PORT:-5432}}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hotel-booking-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel-booking-rdbms
    restart: always
    environment:
      TZ: UTC
      PGADMIN_LISTEN_PORT: ${PGADMIN_CONTAINER_PORT}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:${PGADMIN_CONTAINER_PORT}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      hotel-booking-db:
        condition: service_healthy
    networks:
      - hotel-booking-network

volumes:
  pg_data:
  pgadmin_data:

networks:
  hotel-booking-network:
    driver: bridge
